<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Atrasos — Cadastro de Alunos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <a href="menu.html" class="marca">
      <div class="icone">⏰</div>
      <div>
        <h1>Controle de Atrasos</h1>
        <p>Sistema de Registro e Relatórios</p>
      </div>
    </a>
    <div class="usuario">
      <span>👤 <span id="usuario-email">—</span> ⌄</span>
      <button id="btn-sair" title="Sair">⏻</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="frequencia.html" id="nav-frequencia">🕐 <span class="rotulo">Frequência</span></a>
      <a href="turmas.html" id="nav-turmas">🏠 <span class="rotulo">Turmas</span></a>
      <a href="alunos.html" id="nav-alunos" class="ativo">👥 <span class="rotulo">Alunos</span></a>
      <a href="relatorios.html" id="nav-relatorios">📊 <span class="rotulo">Relatórios</span></a>
      <a href="configuracoes.html" id="nav-configuracoes">⚙️ <span class="rotulo">Configurações</span></a>
    </nav>

    <main class="conteudo">
      <div class="cabecalho-pagina">
        <h2>👥 Cadastro de Alunos</h2>
        <button id="btn-add-aluno" class="btn btn-primary" disabled>+ Adicionar aluno</button>
      </div>

      <div class="cartao">
        <div class="linha-form">
          <div class="campo" style="min-width:220px;">
            <label>Turma</label>
            <select id="select-turma-alunos"><option value="">Selecione uma turma...</option></select>
          </div>
          <div class="campo" style="min-width:220px;">
            <label>Buscar</label>
            <input id="busca-aluno" type="text" placeholder="🔍 Buscar aluno..." disabled>
          </div>
        </div>
        <table>
          <thead><tr><th>Nº</th><th>Nome do aluno</th><th>Responsável</th><th>Ações</th></tr></thead>
          <tbody id="tbody-alunos"><tr><td colspan="4"><div class="vazio">Selecione uma turma acima para ver os alunos.</div></td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- MODAL: ALUNO -->
<div class="modal-fundo" id="modal-aluno">
  <form class="modal" id="form-aluno">
    <h3 id="modal-aluno-titulo">Adicionar aluno</h3>
    <input type="hidden" id="input-aluno-id">
    <div class="campo">
      <label>Nome do aluno</label>
      <input type="text" id="input-aluno-nome" required placeholder="Ex: João da Silva">
    </div>
    <div class="campo">
      <label>Responsável</label>
      <input type="text" id="input-aluno-responsavel" placeholder="Ex: Maria da Silva">
    </div>
    <div class="acoes-modal">
      <button type="button" class="btn btn-ghost" id="btn-cancelar-aluno">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/alunos.js"></script>
</body>
</html>
